; ============================================================
; Satisfactory Splunk Exporter - Configuration
;
; This file is a TEMPLATE. On first launch the mod copies it to
;
;     <game>/FactoryGame/Configs/SatisfactorySplunkMod.ini
;
; EDIT THAT COPY, then restart the game. (The mod folder is wiped
; whenever the mod is updated through SMM; the Configs folder isn't.)
;
; The environment variables SPLUNK_HEC_URL, SPLUNK_HEC_TOKEN and
; SPLUNK_HEC_INDEX override the file (useful on dedicated servers).
; ============================================================

[Splunk]

; Splunk HTTP Event Collector endpoint.
; NOTE: Splunk's default HEC certificate is self-signed and the game
; will REJECT it. For a LAN setup, disable SSL on the HEC input in
; Splunk (Settings > Data Inputs > HTTP Event Collector > Global
; Settings) and use http://. Otherwise install a trusted certificate.
SplunkURL=http://your-splunk-server:8088/services/collector/event

; The token from your HEC input.
HECToken=your-hec-token-here

; Optional: send to a specific index (must be allowed for the token).
; Leave empty to use the token's default index.
Index=

[Collection]

; Seconds between collections, per data type. Each type runs on its
; own timer. Minimum is 1 second.
;
; SummaryInterval    - one aggregate event: totals, counts, power
; PowerInterval      - one event per power circuit
; ProductionInterval - one event per machine (throughput + status);
;                      the heaviest collector, keep >= 15s on big saves
; InventoryInterval  - item totals across all storage containers
; VehicleInterval    - trucks, trains, freight wagon cargo
; PlayerInterval     - player positions
SummaryInterval=5
PowerInterval=5
ProductionInterval=30
InventoryInterval=30
VehicleInterval=10
PlayerInterval=10

; Seconds between HTTP sends to Splunk (events are batched).
FlushInterval=5

; Turn individual data types on/off.
bCollectSummary=True
bCollectPower=True
bCollectProduction=True
bCollectInventory=True
bCollectVehicles=True
bCollectPlayers=True

; Safety cap on events queued between two flushes. Only matters on
; very large factories; extra events are dropped and counted in the log.
MaxBufferedEvents=50000
